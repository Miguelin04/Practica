<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéAPI Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }
    /* Custom Scrollbar for JSON view */
    .json-scroll::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .json-scroll::-webkit-scrollbar-track {
      background: #1f2937;
    }
    .json-scroll::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 4px;
    }
    .type-grass { background-color: #78C850; }
    .type-fire { background-color: #F08030; }
    .type-water { background-color: #6890F0; }
    .type-bug { background-color: #A8B820; }
    .type-normal { background-color: #A8A878; }
    .type-poison { background-color: #A040A0; }
    .type-electric { background-color: #F8D030; }
    .type-ground { background-color: #E0C068; }
    .type-fairy { background-color: #EE99AC; }
    .type-fighting { background-color: #C03028; }
    .type-psychic { background-color: #F85888; }
    .type-rock { background-color: #B8A038; }
    .type-ghost { background-color: #705898; }
    .type-ice { background-color: #98D8D8; }
    .type-dragon { background-color: #7038F8; }
    .type-flying { background-color: #A890F0; }
    .type-steel { background-color: #B8B8D0; }
    .type-dark { background-color: #705848; }
  </style>

    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.294.0?deps=react@18.2.0"
  }
}
</script>

</head>

</html>
